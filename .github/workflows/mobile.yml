name: Mobile

on:
  push:
  pull_request:

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      # Lint (zero warnings), i18n check, parity check, dependency audit, Jest, and expo export for iOS and Android.
      - name: Verify
        run: npm run verify
