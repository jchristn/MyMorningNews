name: Publish SDKs

# Publishes the C# (NuGet), JavaScript (npm), and Python (PyPI) SDKs. Runs on a tag such as sdk-v0.1.0-alpha or by
# hand. Each registry is skipped unless its secret exists: NUGET_API_KEY, NPM_TOKEN, PYPI_API_TOKEN.
# Versions come from the package files and change only with the owner's approval.

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget:
    name: NuGet (MyMorningNews.Sdk)
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack
        run: dotnet pack sdk/csharp/MyMorningNews.Sdk/MyMorningNews.Sdk.csproj -c Release -o out
      - name: Push
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Skipped
        if: env.NUGET_API_KEY == ''
        run: echo "NUGET_API_KEY is not set; the package was built but not published."

  npm:
    name: npm (mymorningnews-sdk)
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check
        working-directory: sdk/js
        run: node --check mymorningnews-sdk.js && npm pack --dry-run
      - name: Publish
        if: env.NPM_TOKEN != ''
        working-directory: sdk/js
        run: npm publish --access public --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skipped
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not set; the package was checked but not published."

  pypi:
    name: PyPI (mymorningnews-sdk)
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: sdk/python
        run: python -m pip install --upgrade build twine && python -m build && python -m twine check dist/*
      - name: Upload
        if: env.PYPI_API_TOKEN != ''
        working-directory: sdk/python
        run: python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      - name: Skipped
        if: env.PYPI_API_TOKEN == ''
        run: echo "PYPI_API_TOKEN is not set; the package was built but not published."
