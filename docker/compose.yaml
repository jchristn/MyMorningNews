name: mymorningnews

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: mymorningnews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mymorningnews
    ports:
      - "127.0.0.1:12102:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mymorningnews"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    image: mymorningnews/server:local
    container_name: mymorningnews-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      MYMORNINGNEWS_SETTINGS_FILE: /app/config/mymorningnews.json
      MYMORNINGNEWS_TELEMETRY_OTLP_ENDPOINT: http://tempo:4317
      MYMORNINGNEWS_TELEMETRY_LOKI_ENDPOINT: http://loki:3100
      MYMORNINGNEWS_TELEMETRY_PROMETHEUS_HOSTNAME: server
      MYMORNINGNEWS_ANTHROPIC_API_KEY: ${MYMORNINGNEWS_ANTHROPIC_API_KEY:-}
      MYMORNINGNEWS_AUTH_SIGNING_KEY: ${MYMORNINGNEWS_AUTH_SIGNING_KEY:-mymorningnews-change-this-signing-key}
      MYMORNINGNEWS_AUTH_ADMIN_API_KEY: ${MYMORNINGNEWS_AUTH_ADMIN_API_KEY:-mymorningnewsadmin}
      MYMORNINGNEWS_OLLAMA_ENDPOINT: ${MYMORNINGNEWS_OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      MYMORNINGNEWS_SEARXNG_URL: http://searxng:8080
      MYMORNINGNEWS_TTS_URL: http://tts:8880/v1
      MYMORNINGNEWS_TTS_ENABLED: ${MYMORNINGNEWS_TTS_ENABLED:-true}
      MYMORNINGNEWS_PUBLIC_BASE_URL: ${MYMORNINGNEWS_PUBLIC_BASE_URL:-http://127.0.0.1:12100}
      MYMORNINGNEWS_APP_BASE_URL: ${MYMORNINGNEWS_APP_BASE_URL:-http://127.0.0.1:12101}
      MYMORNINGNEWS_STORAGE_PROVIDER: ${MYMORNINGNEWS_STORAGE_PROVIDER:-Local}
      MYMORNINGNEWS_STORAGE_LOCAL_DIRECTORY: /data/media
      MYMORNINGNEWS_EMAIL_FILE_DIRECTORY: /data/email
      MYMORNINGNEWS_EMAIL_PROVIDER: ${MYMORNINGNEWS_EMAIL_PROVIDER:-File}
      MYMORNINGNEWS_EMAIL_FROM_ADDRESS: ${MYMORNINGNEWS_EMAIL_FROM_ADDRESS:-briefings@example.test}
      MYMORNINGNEWS_MAILGUN_DOMAIN: ${MYMORNINGNEWS_MAILGUN_DOMAIN:-}
      MYMORNINGNEWS_MAILGUN_API_KEY: ${MYMORNINGNEWS_MAILGUN_API_KEY:-}
      MYMORNINGNEWS_MAILGUN_BASE_URL: ${MYMORNINGNEWS_MAILGUN_BASE_URL:-https://api.mailgun.net/v3/}
      MYMORNINGNEWS_STORAGE_S3_BUCKET: ${MYMORNINGNEWS_STORAGE_S3_BUCKET:-}
      MYMORNINGNEWS_STORAGE_S3_REGION: ${MYMORNINGNEWS_STORAGE_S3_REGION:-us-west-2}
      MYMORNINGNEWS_STORAGE_S3_ENDPOINT: ${MYMORNINGNEWS_STORAGE_S3_ENDPOINT:-}
      MYMORNINGNEWS_STORAGE_S3_ACCESS_KEY: ${MYMORNINGNEWS_STORAGE_S3_ACCESS_KEY:-}
      MYMORNINGNEWS_STORAGE_S3_SECRET_KEY: ${MYMORNINGNEWS_STORAGE_S3_SECRET_KEY:-}
      MYMORNINGNEWS_STORAGE_S3_PREFIX: ${MYMORNINGNEWS_STORAGE_S3_PREFIX:-mymorningnews/}
      MYMORNINGNEWS_STORAGE_ARTIFACT_RETENTION_DAYS: ${MYMORNINGNEWS_STORAGE_ARTIFACT_RETENTION_DAYS:-365}
      MYMORNINGNEWS_PUSH_EXPO_ACCESS_TOKEN: ${MYMORNINGNEWS_PUSH_EXPO_ACCESS_TOKEN:-}
      MYMORNINGNEWS_DB_SERVER: postgres
      MYMORNINGNEWS_DB_PORT: "5432"
      MYMORNINGNEWS_DB_DATABASE: mymorningnews
      MYMORNINGNEWS_DB_USERNAME: postgres
      MYMORNINGNEWS_DB_PASSWORD: password
      # Optional keys for the agent CLIs in the image (claude, codex, gemini, mux). Blank leaves them unset.
      ANTHROPIC_API_KEY: ${CLI_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${CLI_OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${CLI_GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:12100:8000"
    volumes:
      - ./server/mymorningnews.json:/app/config/mymorningnews.json
      - media:/data/media
      - emailout:/data/email
      # Home directory for the agent CLIs, so sign-ins and settings (~/.claude, ~/.codex, ~/.gemini, ~/.mux) survive rebuilds.
      - clihome:/root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/v1.0/api/health"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 15s

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: mymorningnews/dashboard:local
    container_name: mymorningnews-dashboard
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:12101:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 2

  searxng:
    build:
      context: ./searxng
    image: mymorningnews/searxng:local
    container_name: mymorningnews-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${MYMORNINGNEWS_SEARXNG_SECRET:-mymorningnews-change-this-searxng-secret}
      SEARXNG_BASE_URL: http://127.0.0.1:12103/
    ports:
      - "127.0.0.1:12103:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  tts:
    # Kokoro text-to-speech (CPU) for briefing audio and podcast episodes. Large image (several GB). Set
    # MYMORNINGNEWS_TTS_ENABLED=false on the server and skip this service ("docker compose up -d --scale tts=0") to run without audio.
    build:
      context: ./tts
    image: mymorningnews/tts:local
    container_name: mymorningnews-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:12104:8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8880/health"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 120s

  mcp:
    # MCP server (Voltaic, Streamable HTTP on /mcp). Start with: docker compose --profile mcp up -d
    # Clients authenticate with the same bearer token or access key as the REST API.
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: docker/mcp/Dockerfile
    image: mymorningnews/mcp:local
    container_name: mymorningnews-mcp
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      MYMORNINGNEWS_MCP_SERVER_URL: http://server:8000
      MYMORNINGNEWS_MCP_HOSTNAME: "*"
      MYMORNINGNEWS_MCP_PORT: "8100"
      MYMORNINGNEWS_OTLP_ENDPOINT: http://tempo:4317
    ports:
      - "127.0.0.1:12105:8100"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8100/"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  ollama:
    # Optional local Ollama (start with --profile ollama). It runs on any host, CPU only on macOS and Windows (Docker
    # has no GPU there), so on a Mac a native Ollama is faster; the server reaches that at host.docker.internal:11434.
    # To use this container instead, set MYMORNINGNEWS_OLLAMA_ENDPOINT=http://ollama:11434 in docker/.env.
    profiles: ["ollama"]
    build:
      context: ./ollama
    image: mymorningnews/ollama:local
    container_name: mymorningnews-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:12120:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  prometheus:
    build:
      context: ./prometheus
    image: mymorningnews/prometheus:local
    container_name: mymorningnews-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "127.0.0.1:12111:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 2

  tempo:
    build:
      context: ./tempo
    image: mymorningnews/tempo:local
    container_name: mymorningnews-tempo
    restart: unless-stopped
    user: "0"
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - "127.0.0.1:12112:3200"
      - "127.0.0.1:12113:4317"
      - "127.0.0.1:12114:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  loki:
    build:
      context: ./loki
    image: mymorningnews/loki:local
    container_name: mymorningnews-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - "127.0.0.1:12115:3100"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: mymorningnews-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - "127.0.0.1:12110:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

volumes:
  pgdata:
  media:
  emailout:
  clihome:
  ollama:
  prometheus:
  tempo:
  loki:
  grafana:
