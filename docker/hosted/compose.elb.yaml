# Load balancer overlay for the hosted service (plan section 33): a load balancer such as an AWS Application Load
# Balancer terminates TLS for https://app.mymorningnews.ai and routes by path, so Caddy is not used.
#   docker compose -f compose.yaml -f hosted/compose.elb.yaml up -d --build
#
# Only these ports are published on the host's interfaces (load balancer target ports); restrict them to the load
# balancer's security group:
#   8000 -> server (HTTP 8000 in the container): /v1.0/*, /openapi.json, /swagger*, /.well-known/*
#           health check GET /v1.0/api/health (200, no authentication, not rate limited)
#   8080 -> dashboard (HTTP 80 in the container): every other path
#           health check GET /health
#   8100 -> mcp (HTTP 8100 in the container), only with COMPOSE_PROFILES=mcp: /mcp, /mcp/*
#           health check GET / (200)
# Every other service stays on 127.0.0.1. See docs/HOSTING.md, "Behind a load balancer".
services:
  server:
    ports: !override
      - "8000:8000"
    volumes:
      - ./hosted/mymorningnews.json:/app/config/mymorningnews.json
    environment:
      MYMORNINGNEWS_HOSTING_TURNSTILE_SITE_KEY: ${MYMORNINGNEWS_HOSTING_TURNSTILE_SITE_KEY:-}
      MYMORNINGNEWS_HOSTING_TURNSTILE_SECRET_KEY: ${MYMORNINGNEWS_HOSTING_TURNSTILE_SECRET_KEY:-}
      # Universal links: /.well-known/apple-app-site-association needs the Apple Team ID, and
      # /.well-known/assetlinks.json needs the Play App Signing SHA-256 fingerprint (comma-separated when several).
      # Each file answers 404 NotConfigured until its value is set.
      MYMORNINGNEWS_HOSTING_APPLE_TEAM_ID: ${MYMORNINGNEWS_HOSTING_APPLE_TEAM_ID:-}
      MYMORNINGNEWS_HOSTING_ANDROID_CERT_FINGERPRINTS: ${MYMORNINGNEWS_HOSTING_ANDROID_CERT_FINGERPRINTS:-}
      # MCP address published in client config. Set MYMORNINGNEWS_MCP_ON_PUBLIC_BASE_URL=true together with
      # COMPOSE_PROFILES=mcp: the load balancer then routes /mcp to port 8100. Or set MYMORNINGNEWS_MCP_PUBLIC_URL to an
      # address of your own. With neither, no MCP address is published (never a loopback one).
      MYMORNINGNEWS_MCP_ON_PUBLIC_BASE_URL: ${MYMORNINGNEWS_MCP_ON_PUBLIC_BASE_URL:-false}
      MYMORNINGNEWS_MCP_PUBLIC_URL: ${MYMORNINGNEWS_MCP_PUBLIC_URL:-}
      # Agent CLIs run inside the server as its own user. Anyone can sign up here, so only global administrators may
      # connect them (for example a Claude Code setup token); everyone else uses provider API keys.
      MYMORNINGNEWS_MODELS_ALLOW_AGENT_CLIS: "true"
      MYMORNINGNEWS_MODELS_AGENT_CLIS_ADMINS_ONLY: "true"

  dashboard:
    ports: !override
      - "8080:80"

  # MCP server, started only with COMPOSE_PROFILES=mcp. The load balancer forwards /mcp and /mcp/* to this port; also
  # set MYMORNINGNEWS_MCP_ON_PUBLIC_BASE_URL=true so the app shows <public base URL>/mcp.
  mcp:
    ports: !override
      - "8100:8100"

  # Speech runs outside this host by default here (set tts.endpoint on the Server settings page). Start the bundled
  # Kokoro container with COMPOSE_PROFILES=local-tts when the host has the memory for it (about 3 GB).
  tts:
    profiles: ["local-tts"]
