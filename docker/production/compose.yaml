# My Morning News production deployment behind a load balancer that terminates TLS (plan section 33).
# Generated from docker/compose.yaml plus docker/hosted/compose.elb.yaml; regenerate it when either changes:
#   docker compose -f compose.yaml -f hosted/compose.elb.yaml config --no-interpolate --no-path-resolution
# Every service runs a published image (jchristn77/mymorningnews-<type>:latest); nothing is built here.
# The deployment folder (for example ~/mymorningnews) holds only this file, update.sh, mymorningnews.json (from
# docker/hosted/mymorningnews.json), and .env (from docker/.env.example, with real secrets).
# Load balancer targets: 8000 (server, health GET /v1.0/api/health) and 8080 (dashboard, health GET /health).
# (c) 2026 Lattice AI LLC.
name: mymorningnews
networks:
  default:
    name: mymorningnews_default
services:
  dashboard:
    container_name: mymorningnews-dashboard
    depends_on:
      server:
        condition: service_healthy
        required: true
    healthcheck:
      interval: 5s
      retries: 2
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1/health
      timeout: 5s
    image: jchristn77/mymorningnews-dashboard:latest
    networks:
      default: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8080"
        target: 80
    restart: unless-stopped
  grafana:
    container_name: mymorningnews-grafana
    depends_on:
      loki:
        condition: service_healthy
        required: true
      prometheus:
        condition: service_healthy
        required: true
      tempo:
        condition: service_healthy
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000/api/health
      timeout: 5s
    image: jchristn77/mymorningnews-grafana:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12110"
        target: 3000
    restart: unless-stopped
    volumes:
      - source: grafana
        target: /var/lib/grafana
        type: volume
        volume: {}
  loki:
    command:
      - -config.file=/etc/loki/loki.yaml
    container_name: mymorningnews-loki
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3100/ready
      timeout: 5s
    image: jchristn77/mymorningnews-loki:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12115"
        target: 3100
    restart: unless-stopped
    volumes:
      - source: loki
        target: /loki
        type: volume
        volume: {}
  mcp:
    container_name: mymorningnews-mcp
    depends_on:
      server:
        condition: service_healthy
        required: true
    environment:
      MYMORNINGNEWS_MCP_HOSTNAME: '*'
      MYMORNINGNEWS_MCP_PORT: "8100"
      MYMORNINGNEWS_MCP_PROMETHEUS_HOSTNAME: mcp
      MYMORNINGNEWS_MCP_PROMETHEUS_PORT: "9465"
      MYMORNINGNEWS_MCP_SERVER_URL: http://server:8000
      MYMORNINGNEWS_OTLP_ENDPOINT: http://tempo:4317
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD
        - curl
        - -fs
        - http://127.0.0.1:8100/
      timeout: 5s
    image: jchristn77/mymorningnews-mcp:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12105"
        target: 8100
    profiles:
      - mcp
    restart: unless-stopped
  ollama:
    container_name: mymorningnews-ollama
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:11434/api/tags
      timeout: 5s
    image: jchristn77/mymorningnews-ollama:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12120"
        target: 11434
    profiles:
      - ollama
    restart: unless-stopped
    volumes:
      - source: ollama
        target: /root/.ollama
        type: volume
        volume: {}
  postgres:
    container_name: mymorningnews-postgres
    environment:
      POSTGRES_DB: mymorningnews
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d mymorningnews
      timeout: 5s
    image: pgvector/pgvector:0.8.1-pg17
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12102"
        target: 5432
    restart: unless-stopped
    volumes:
      - source: pgdata
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    container_name: mymorningnews-prometheus
    healthcheck:
      interval: 5s
      retries: 2
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9090/-/healthy
      timeout: 5s
    image: jchristn77/mymorningnews-prometheus:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12111"
        target: 9090
    restart: unless-stopped
    volumes:
      - source: prometheus
        target: /prometheus
        type: volume
        volume: {}
  searxng:
    container_name: mymorningnews-searxng
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:12103/
      SEARXNG_SECRET: ${MYMORNINGNEWS_SEARXNG_SECRET:-mymorningnews-change-this-searxng-secret}
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/healthz
      timeout: 5s
    image: jchristn77/mymorningnews-searxng:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12103"
        target: 8080
    restart: unless-stopped
  server:
    container_name: mymorningnews-server
    depends_on:
      loki:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      searxng:
        condition: service_healthy
        required: true
      tempo:
        condition: service_healthy
        required: true
    environment:
      - ANTHROPIC_API_KEY=${CLI_ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${CLI_GEMINI_API_KEY:-}
      - MYMORNINGNEWS_ANTHROPIC_API_KEY=${MYMORNINGNEWS_ANTHROPIC_API_KEY:-}
      - MYMORNINGNEWS_APP_BASE_URL=${MYMORNINGNEWS_APP_BASE_URL:-http://127.0.0.1:12101}
      - MYMORNINGNEWS_AUTH_ADMIN_API_KEY=${MYMORNINGNEWS_AUTH_ADMIN_API_KEY:-mymorningnewsadmin}
      - MYMORNINGNEWS_AUTH_SIGNING_KEY=${MYMORNINGNEWS_AUTH_SIGNING_KEY:-mymorningnews-change-this-signing-key}
      - MYMORNINGNEWS_DB_DATABASE=mymorningnews
      - MYMORNINGNEWS_DB_PASSWORD=password
      - MYMORNINGNEWS_DB_PORT=5432
      - MYMORNINGNEWS_DB_SERVER=postgres
      - MYMORNINGNEWS_DB_USERNAME=postgres
      - MYMORNINGNEWS_EMAIL_FILE_DIRECTORY=/data/email
      - MYMORNINGNEWS_EMAIL_FROM_ADDRESS=${MYMORNINGNEWS_EMAIL_FROM_ADDRESS:-briefings@example.test}
      - MYMORNINGNEWS_EMAIL_PROVIDER=${MYMORNINGNEWS_EMAIL_PROVIDER:-File}
      - MYMORNINGNEWS_MAILGUN_API_KEY=${MYMORNINGNEWS_MAILGUN_API_KEY:-}
      - MYMORNINGNEWS_MAILGUN_BASE_URL=${MYMORNINGNEWS_MAILGUN_BASE_URL:-https://api.mailgun.net/v3/}
      - MYMORNINGNEWS_MAILGUN_DOMAIN=${MYMORNINGNEWS_MAILGUN_DOMAIN:-}
      - MYMORNINGNEWS_MODELS_ALLOW_AGENT_CLIS=false
      - MYMORNINGNEWS_OLLAMA_ENDPOINT=${MYMORNINGNEWS_OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      - MYMORNINGNEWS_PUBLIC_BASE_URL=${MYMORNINGNEWS_PUBLIC_BASE_URL:-http://127.0.0.1:12100}
      - MYMORNINGNEWS_PUSH_EXPO_ACCESS_TOKEN=${MYMORNINGNEWS_PUSH_EXPO_ACCESS_TOKEN:-}
      - MYMORNINGNEWS_SEARXNG_URL=http://searxng:8080
      - MYMORNINGNEWS_SETTINGS_FILE=/app/config/mymorningnews.json
      - MYMORNINGNEWS_STORAGE_ARTIFACT_RETENTION_DAYS=${MYMORNINGNEWS_STORAGE_ARTIFACT_RETENTION_DAYS:-365}
      - MYMORNINGNEWS_STORAGE_LOCAL_DIRECTORY=/data/media
      - MYMORNINGNEWS_STORAGE_PROVIDER=${MYMORNINGNEWS_STORAGE_PROVIDER:-Local}
      - MYMORNINGNEWS_STORAGE_S3_ACCESS_KEY=${MYMORNINGNEWS_STORAGE_S3_ACCESS_KEY:-}
      - MYMORNINGNEWS_STORAGE_S3_BUCKET=${MYMORNINGNEWS_STORAGE_S3_BUCKET:-}
      - MYMORNINGNEWS_STORAGE_S3_ENDPOINT=${MYMORNINGNEWS_STORAGE_S3_ENDPOINT:-}
      - MYMORNINGNEWS_STORAGE_S3_PREFIX=${MYMORNINGNEWS_STORAGE_S3_PREFIX:-mymorningnews/}
      - MYMORNINGNEWS_STORAGE_S3_REGION=${MYMORNINGNEWS_STORAGE_S3_REGION:-us-west-2}
      - MYMORNINGNEWS_STORAGE_S3_SECRET_KEY=${MYMORNINGNEWS_STORAGE_S3_SECRET_KEY:-}
      - MYMORNINGNEWS_TELEMETRY_LOKI_ENDPOINT=http://loki:3100
      - MYMORNINGNEWS_TELEMETRY_OTLP_ENDPOINT=http://tempo:4317
      - MYMORNINGNEWS_TELEMETRY_PROMETHEUS_HOSTNAME=server
      - MYMORNINGNEWS_TTS_ENABLED=${MYMORNINGNEWS_TTS_ENABLED:-true}
      - MYMORNINGNEWS_TTS_URL=http://tts:8880/v1
      - OPENAI_API_KEY=${CLI_OPENAI_API_KEY:-}
      - MYMORNINGNEWS_HOSTING_APPLE_TEAM_ID=${MYMORNINGNEWS_HOSTING_APPLE_TEAM_ID:-}
      - MYMORNINGNEWS_HOSTING_TURNSTILE_SECRET_KEY=${MYMORNINGNEWS_HOSTING_TURNSTILE_SECRET_KEY:-}
      - MYMORNINGNEWS_HOSTING_TURNSTILE_SITE_KEY=${MYMORNINGNEWS_HOSTING_TURNSTILE_SITE_KEY:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 15s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8000/v1.0/api/health
      timeout: 5s
    image: jchristn77/mymorningnews-server:latest
    networks:
      default: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8000"
        target: 8000
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: ./mymorningnews.json
        target: /app/config/mymorningnews.json
        type: bind
      - source: media
        target: /data/media
        type: volume
        volume: {}
      - source: emailout
        target: /data/email
        type: volume
        volume: {}
      - source: clihome
        target: /root
        type: volume
        volume: {}
  tempo:
    command:
      - -config.file=/etc/tempo/tempo.yaml
    container_name: mymorningnews-tempo
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 20s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3200/ready
      timeout: 5s
    image: jchristn77/mymorningnews-tempo:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12112"
        target: 3200
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12113"
        target: 4317
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12114"
        target: 4318
    restart: unless-stopped
    user: "0"
    volumes:
      - source: tempo
        target: /var/tempo
        type: volume
        volume: {}
  tts:
    container_name: mymorningnews-tts
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 120s
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8880/health
      timeout: 5s
    image: jchristn77/mymorningnews-tts:latest
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "12104"
        target: 8880
    restart: unless-stopped
volumes:
  clihome:
    name: mymorningnews_clihome
  emailout:
    name: mymorningnews_emailout
  grafana:
    name: mymorningnews_grafana
  loki:
    name: mymorningnews_loki
  media:
    name: mymorningnews_media
  ollama:
    name: mymorningnews_ollama
  pgdata:
    name: mymorningnews_pgdata
  prometheus:
    name: mymorningnews_prometheus
  tempo:
    name: mymorningnews_tempo
